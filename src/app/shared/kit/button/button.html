@if (icon && !text) {
  <!-- КРУГЛАЯ КНОПКА (только иконка) -->
  <button mat-mini-fab
          [style.background-color]="backgroundColor"
          [disabled]="loading"
          [class]="sizeClass()">
    @if (loading) {
      <app-progress-spinner size="sm" />
    } @else {
      <mat-icon>{{ icon }}</mat-icon>
    }
  </button>
} @else {
  <!-- ОБЫЧНАЯ КНОПКА (текст или текст + иконка) -->
  <button mat-raised-button
          [style.background-color]="backgroundColor"
          [disabled]="loading"
          [class]="sizeClass()">
    <div class="flex items-center justify-center gap-2">
      @if (loading) {
        <app-progress-spinner size="sm" />
      } @else {
        @if (icon && iconPosition === 'start') {
          <mat-icon>{{ icon }}</mat-icon>
        }

        @if (text) {
          <span>{{ text }}</span>
        }
        <ng-content />

        @if (icon && iconPosition === 'end') {
          <mat-icon>{{ icon }}</mat-icon>
        }
      }
    </div>
  </button>
}

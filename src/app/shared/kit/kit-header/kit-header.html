<mat-toolbar class="kit-header">
  <div class="header-container">
    <div class="header-left">
      <div class="flex items-center gap-2 sm:gap-3">
        @if (logoUrl()) {
          <img [src]="logoUrl()" alt="Logo" class="h-7 w-7 sm:h-8 sm:w-8 object-contain" />
        }
        <span class="font-medium text-sm sm:text-lg tracking-tight truncate max-w-[150px] sm:max-w-none">{{ appName() }}</span>
      </div>

      <ng-content select="[left]"></ng-content>
    </div>

    <div class="header-right">
      <ng-content select="[actions]"></ng-content>

      @if (profile(); as user) {
        <app-kit-avatar
          [displayName]="user.username || user.email"
          [accentHue]="avatarHue()"
          [label]="profileAriaLabel()"
          size="md"
          (activated)="profileClick.emit()"
        />
      }
    </div>
  </div>
</mat-toolbar>

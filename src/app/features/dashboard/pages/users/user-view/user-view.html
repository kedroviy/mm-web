<div class="user-view">
  @if (loading()) {
    <p class="muted">Загрузка…</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Имя пользователя</mat-label>
        <input matInput formControlName="username" autocomplete="off" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="off" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Тип клиента</mat-label>
        <mat-select formControlName="client">
          @for (c of clientTypes; track c) {
            <mat-option [value]="c">{{ c }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Новый пароль</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password" />
        <mat-hint>Оставьте пустым, чтобы не менять пароль</mat-hint>
      </mat-form-field>
      <div class="actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="saving()">Сохранить</button>
        <button mat-stroked-button type="button" routerLink="..">Назад к списку</button>
        <button mat-button type="button" color="warn" [disabled]="saving()" (click)="deleteUser()">
          Удалить
        </button>
      </div>
    </form>
  }
</div>

<app-kit-table
  [dataSource]="store.users()"
  [columns]="columns"
  [loading]="store.loading()"
  [cellTemplates]="{ lastLoginAt: lastLoginTpl, platform: platformTpl }"
  [showViewAction]="true"
  [totalItems]="store.totalItems()"
  [page]="store.page()"
  [limit]="store.limit()"
  (pageChange)="onPageChange($event)"
  baseRoute="."
/>

<ng-template #lastLoginTpl let-element>
  <span>
    @if (element.lastLoginAt) {
      {{ element.lastLoginAt | appDate }}
    } @else {
      —
    }
  </span>
</ng-template>

<ng-template #platformTpl let-element>
  <span>{{ element.platform || '—' }}</span>
</ng-template>
